name: CI

on:
    pull_request:
    push:
        branches:
            - main
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with: 
                node-version: 20
            - run: npm ci
              working-directory: app
            - run: npm run lint
              working-directory: app
            - run: npm test
              working-directory: app

